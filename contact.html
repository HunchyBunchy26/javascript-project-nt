<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Foot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <button class="menu-toggle" id="menu-toggle"
                type="button" aria-label="Open navigation"
                aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="nav-links" id="nav-links">
            <a href="home.html">Home</a>
            <a href="#products">Products</a>
            <a href="#about">About</a>
            <a href="contact.html">Contact Us</a>
        </nav>
        <a href="home.html" class="title">👣 LITTLE FOOT 👣</a>
        <button class="cart-button" id="cart-button" type="button" aria-label="Open shopping cart">
            🛒 Cart (<span id="cart-count">0</span>)
        </button>
    </header>
    <main class="contact-page">

        <section class="contact-section">

            <div class="contact-heading">
                <p>GET IN TOUCH</p>
                <h1>We'd love to hear from you.</h1>
                <p>Have a question? Send us a message and we'll be happy to help.</p>
            </div>

            <form id="contact-form">

                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <button type="submit" class="contact-submit">
                    Send Message
                </button>

                <p id="form-feedback" role="status" aria-live="polite"></p>

            </form>

        </section>

    </main>
</body>
</html>
